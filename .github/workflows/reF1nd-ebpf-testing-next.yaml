name: Build reF1nd sing-box eBPF core

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Source ref to build (tag/branch/commit)'
        type: string
        required: true
        default: 'reF1nd-testing-next'

jobs:
  verifier:
    runs-on: ubuntu-24.04
    outputs:
      detected_version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: reF1nd/sing-box
          ref: ${{ github.event.inputs.source_ref }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.7'

      - name: Determine Version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          BASE_VERSION=$(CGO_ENABLED=0 go run ./cmd/internal/read_tag | tail -n 1 | tr -d '\r\n')
          SHORT_SHA=$(git rev-parse --short=8 HEAD)
          FINAL_VERSION="${BASE_VERSION}-reF1nd.${SHORT_SHA}"
          
          echo "version=${FINAL_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Detected Version: ${FINAL_VERSION}"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm gcc-aarch64-linux-gnu

      - name: Verify eBPF Program
        shell: bash
        run: |
          set -euo pipefail
          make -C common/ebpf check

          cgroup_path=/sys/fs/cgroup/sing-box-ebpf-verifier
          sudo mkdir -p "$cgroup_path"
          sudo env \
            "PATH=$PATH" \
            SING_BOX_EBPF_INTEGRATION=1 \
            SING_BOX_EBPF_INTEGRATION_CGROUP="$cgroup_path" \
            go test -v -count=1 \
              -run 'Test(CgroupBackendProgramLoad|SharedNetwork(SharedMap|Standalone)ProgramLoad)Integration' \
              -tags with_ebpf,ebpf_integration \
              ./common/ebpf 2>&1 | tee verifier.log
          sudo rmdir "$cgroup_path"

      - name: Upload verifier log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ebpf-verifier-log
          path: verifier.log

  build:
    needs: verifier
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: reF1nd/sing-box
          ref: ${{ github.event.inputs.source_ref }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'

      - name: Install Cross-Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu clang llvm

      - name: Build for Linux ARM64
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 0
          CC: aarch64-linux-gnu-gcc
          VERSION: ${{ needs.verifier.outputs.detected_version }}
          TAGS: with_quic,with_utls,with_clash_api,with_ebpf,badlinkname,tfogo_checklinkname0
        run: |
          LDFLAGS="-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' -s -w -buildid= -checklinkname=0"
          make build TAGS="$TAGS" LDFLAGS="$LDFLAGS"

      - name: Rename executable
        run: |
          VERSION="${{ needs.verifier.outputs.detected_version }}"
          mv sing-box "sing-box-${VERSION}-linux-arm64"

      - name: Verify binary architecture
        run: file sing-box-*

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sing-box-reF1nd-linux-arm64-ebpf
          path: sing-box-*
