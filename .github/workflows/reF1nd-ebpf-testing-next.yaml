name: Build reF1nd sing-box eBPF core

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Source ref to build (tag/branch/commit)'
        type: string
        required: true
        default: 'reF1nd-testing-next'

jobs:
  verifier:
    runs-on: ubuntu-24.04
    outputs:
      detected_version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: reF1nd/sing-box
          ref: ${{ github.event.inputs.source_ref }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.7'

      - name: Determine Version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          BASE_VERSION=$(CGO_ENABLED=0 go run ./cmd/internal/read_tag | tail -n 1 | tr -d '\r\n')
          SHORT_SHA=$(git rev-parse --short=8 HEAD)
          FINAL_VERSION="${BASE_VERSION}-reF1nd.${SHORT_SHA}"
          
          echo "version=${FINAL_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Detected Version: ${FINAL_VERSION}"

      - name: Verify checked-in eBPF objects
        run: |
          set -euo pipefail
          echo "Checking for pre-compiled eBPF objects..."
          test -f common/ebpf/internal/bpfgen/cgroup_bpfel.o
          test -f common/ebpf/internal/bpfgen/shared_network_bpfel.o
          test -f common/ebpf/internal/bpfgen/splice_bpfel.o

      - name: Run focused eBPF tests
        shell: bash
        run: |
          set -euo pipefail
          go test -v -count=1 \
            -tags "with_ebpf" \
            ./common/ebpf ./protocol/ebpf

  build:
    needs: verifier
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: reF1nd/sing-box
          ref: ${{ github.event.inputs.source_ref }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.7'

      - name: Build for Linux ARM64
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 0
          VERSION: ${{ needs.verifier.outputs.detected_version }}
          TAGS: with_quic,with_utls,with_clash_api,with_ebpf,badlinkname,tfogo_checklinkname0
        run: |
          set -euo pipefail

          if [ -f release/LDFLAGS ]; then
            SHARED_LDFLAGS=$(tr -d '\n' < release/LDFLAGS)
          else
            SHARED_LDFLAGS=""
          fi

          go build -v -trimpath \
            -tags "$TAGS" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' $SHARED_LDFLAGS -s -w -buildid=" \
            -o "sing-box-${VERSION}-linux-arm64" \
            ./cmd/sing-box

      - name: Verify binary architecture
        run: |
          file sing-box-*
          if ! file sing-box-* | grep -q "aarch64"; then echo "Error: Not ARM64"; exit 1; fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-reF1nd-arm64
          path: sing-box-*
