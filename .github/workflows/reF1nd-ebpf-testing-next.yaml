name: Build reF1nd sing-box eBPF core

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Source ref to build (tag/branch/commit)'
        type: string
        required: true
        default: 'reF1nd-testing-next'

jobs:
  verifier:
    runs-on: ubuntu-latest
    outputs:
      detected_version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: reF1nd/sing-box
          ref: ${{ github.event.inputs.source_ref }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.7'

      - name: Determine Version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          go mod tidy
          RAW_VERSION=$(go run ./cmd/internal/read_tag | tail -n 1 | tr -d '\r\n')
          CLEAN_RAW="${RAW_VERSION#v}"
          CLEAN_RAW="${CLEAN_RAW%-reF1nd}"
          if [[ "$CLEAN_RAW" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-alpha\.([0-9]+) ]]; then
            BASE_VERSION="r${BASH_REMATCH[1]}-a${BASH_REMATCH[2]}"
          elif [[ "$CLEAN_RAW" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-beta\.([0-9]+) ]]; then
            BASE_VERSION="r${BASH_REMATCH[1]}-b${BASH_REMATCH[2]}"
          elif [[ "$CLEAN_RAW" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-rc\.([0-9]+) ]]; then
            BASE_VERSION="r${BASH_REMATCH[1]}-r${BASH_REMATCH[2]}"
          elif [[ "$CLEAN_RAW" =~ ^([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            BASE_VERSION="r${BASH_REMATCH[1]}"
          else
            BASE_VERSION="r${CLEAN_RAW}"
          fi

          SHORT_SHA=$(git rev-parse --short=8 HEAD)
          FINAL_VERSION="${BASE_VERSION}-${SHORT_SHA}"
          
          echo "version=${FINAL_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Raw Version: $RAW_VERSION"
          echo "Processed Version: ${FINAL_VERSION}"

      - name: Verify checked-in eBPF objects
        run: |
          set -euo pipefail
          test -f common/ebpf/internal/bpfgen/cgroup_bpfel.o
          test -f common/ebpf/internal/bpfgen/shared_network_bpfel.o
          test -f common/ebpf/internal/bpfgen/splice_bpfel.o

      - name: Run focused eBPF tests
        shell: bash
        run: |
          go test -v -count=1 -tags "with_ebpf" ./common/ebpf ./protocol/ebpf ./include ./option

  build:
    needs: verifier
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: reF1nd/sing-box
          ref: ${{ github.event.inputs.source_ref }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.7'

      - name: Build for Linux ARM64
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 0
          VERSION: ${{ needs.verifier.outputs.detected_version }}
          TAGS: with_ebpf,with_quic,with_utls,with_clash_api
        run: |
          set -euo pipefail

          SHARED_LDFLAGS=""
          [ -f release/LDFLAGS ] && SHARED_LDFLAGS=$(cat release/LDFLAGS)

          go build -v -trimpath \
            -tags "$TAGS" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' $SHARED_LDFLAGS -s -w -buildid= -checklinkname=0" \
            -o "sing-box-${VERSION}-linux-arm64" \
            ./cmd/sing-box

      - name: Verify binary architecture
        run: |
          file sing-box-*
          if ! file sing-box-* | grep -q "aarch64"; then echo "Error: Not ARM64"; exit 1; fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sing-box-linux-arm64-ebpf
          path: sing-box-*
