name: Build reF1nd-testing sing-box ebpf core

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Source ref to build (tag/branch/commit)'
        type: string
        required: true
        default: 'reF1nd-testing-next'
      custom_version:
        description: 'Manual Version (e.g. 1.14.0-beta.17)'
        type: string
        required: true
        default: '1.14.0-beta.17'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout upstream
        uses: actions/checkout@v6
        with:
          repository: reF1nd/sing-box
          ref: ${{ github.event.inputs.source_ref }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'

      - name: Install NDK r29 (Clang 21)
        run: |
          set -xeuo pipefail
          curl -Lo ndk.zip https://dl.google.com/android/repository/android-ndk-r29-canary-linux.zip || \
          curl -Lo ndk.zip https://dl.google.com/android/repository/android-ndk-r28-linux.zip
          unzip -q ndk.zip
          NDK_PATH=$(ls -d android-ndk-r*)
          TOOLCHAIN_BIN="$GITHUB_WORKSPACE/$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin"
          $TOOLCHAIN_BIN/clang --version
          echo "CLANG_PATH=$TOOLCHAIN_BIN" >> $GITHUB_ENV

      - name: Generate eBPF Object
        run: |
          set -xeuo pipefail
          export PATH="${{ env.CLANG_PATH }}:$PATH"
          make -C common/ebpf CLANG=clang STRIP=llvm-strip

      - name: Define build metadata
        id: meta
        run: |
          set -xeuo pipefail
          # 加入 with_ebpf 标签
          TAGS="with_gvisor with_quic with_grpc with_utls with_clash_api with_ebpf badlinkname"
          OUT="sing-box-${{ github.event.inputs.custom_version }}-linux-arm64"
          echo "TAGS=$TAGS" >> $GITHUB_ENV
          echo "OUT=$OUT" >> $GITHUB_ENV

      - name: Build sing-box (linux arm64)
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: arm64
        run: |
          set -xeuo pipefail
          go build \
            -trimpath \
            -o "${OUT}" \
            -ldflags="-X 'github.com/sagernet/sing-box/constant.Version=${{ github.event.inputs.custom_version }}' -s -w -buildid= -checklinkname=0" \
            -tags="${TAGS}" \
            ./cmd/sing-box

      - name: Verify build
        run: |
          file "${{ env.OUT }}"
          ./"${{ env.OUT }}" version || true

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sing-box-ebpf-arm64
          path: ${{ env.OUT }}
