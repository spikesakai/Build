name: Build reF1nd-testing sing-box ebpf core

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Source ref to build (tag/branch/commit)'
        type: string
        required: true
        default: 'reF1nd-testing-next'
      custom_version:
        description: 'Manual Version (e.g. 1.14.0-beta.17)'
        type: string
        required: true
        default: '1.14.0-beta.17'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout upstream
        uses: actions/checkout@v6
        with:
          repository: reF1nd/sing-box
          ref: ${{ github.event.inputs.source_ref }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm make libbpf-dev

      - name: Bypass eBPF Version Check and Generate
        run: |
          set -xeuo pipefail
          sed -i 's/ifeq ($(shell test $(CLANG_VERSION) -lt 21; echo $$?),0)/ifeq (0,1)/' common/ebpf/Makefile
          make -C common/ebpf CLANG=clang STRIP=llvm-strip

      - name: Build sing-box (linux arm64)
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: arm64
        run: |
          set -xeuo pipefail
          TAGS="with_gvisor with_quic with_grpc with_utls with_clash_api with_ebpf badlinkname"
          OUT="sing-box-${{ github.event.inputs.custom_version }}-linux-arm64"
          
          go build \
            -trimpath \
            -o "${OUT}" \
            -ldflags="-X 'github.com/sagernet/sing-box/constant.Version=${{ github.event.inputs.custom_version }}' -s -w -buildid= -checklinkname=0" \
            -tags="${TAGS}" \
            ./cmd/sing-box
          
          echo "OUT_FILE=${OUT}" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sing-box-ebpf-arm64
          path: ${{ env.OUT_FILE }}
