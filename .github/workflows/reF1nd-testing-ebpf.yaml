name: Build reF1nd sing-box for OpenWrt (Pure Go eBPF)

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Source ref to build (tag/branch/commit)'
        type: string
        required: true
        default: 'reF1nd-testing-next'
      custom_version:
        description: 'Manual Version'
        type: string
        required: true
        default: '1.14.0-beta.17'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: reF1nd/sing-box
          ref: ${{ github.event.inputs.source_ref }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'

      - name: Install Build Essentials
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm

      - name: Generate eBPF Objects
        env:
          GOFLAGS: "-tags=with_ebpf" 
        run: |
          clang --version
          go generate ./...

      - name: Build Binary
        run: |
          go build -v -trimpath \
            -tags "with_gvisor,with_quic,with_dhcp,with_utls,with_clash_api,with_ebpf,badlinkname,tfogo_checklinkname0" \
            -ldflags "-s -w -X 'github.com/sagernet/sing-box/constant.Version=${{ github.event.inputs.custom_version }}'" \
            -o sing-box ./cmd/sing-box

      - name: Verify and Pack
        run: |
          file sing-box
          mv sing-box sing-box-${{ github.event.inputs.custom_version }}-openwrt-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sing-box-openwrt-arm64
          path: sing-box-*
