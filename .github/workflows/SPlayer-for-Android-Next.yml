name: Build Android APK Only

on:
  workflow_dispatch: # 支持在 GitHub 网页 Actions 页面手动点击 "Run workflow" 触发
  push:
    branches:
      - Android # 或者改为你的分支名，比如 main
    paths-ignore:
      - '**.md'

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 如果你是在自己的空仓库里跑，想直接拉取上游仓库代码，取消下面两行的注释：
          repository: 'SPlayer-CE/SPlayer-for-Android-Next'
          ref: 'Android'
          fetch-depth: 1

      - name: 配置 pnpm
        uses: pnpm/action-setup@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 配置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: 安装项目依赖
        run: pnpm install --frozen-lockfile

      - name: 配置签名 (可选)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            {
              echo "storeFile=release.keystore"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
            echo "已配置正式签名"
          else
            echo "未配置 Secrets，脚本将自动回退到 Debug 默认签名"
          fi

      - name: 构建 WebView 与嵌入 Node 资源
        run: pnpm build:android

      - name: 编译 Release APK
        run: cd android && ./gradlew assembleRelease --stacktrace

      - name: 收集 APK 产物
        run: |
          mkdir -p dist-android
          for abi in armeabi-v7a arm64-v8a x86 x86_64 universal; do
            # 兼容单架构包或通用包命名
            src="android/app/build/outputs/apk/release/app-${abi}-release.apk"
            if [ -f "$src" ]; then
              cp "$src" "dist-android/SPlayer-Next-${abi}.apk"
            fi
          done
          # 如果是未分包的单一 APK
          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp "android/app/build/outputs/apk/release/app-release.apk" "dist-android/SPlayer-Next-universal.apk"
          fi
          ls -la dist-android

      - name: 上传 APK 到 Artifacts (供网页下载)
        uses: actions/upload-artifact@v4
        with:
          name: SPlayer-Next-APKs
          path: dist-android/*.apk
          retention-days: 7 # 产物保留天数，默认最长 90 天
