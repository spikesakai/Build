name: Build Android APK Only

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 检出上游项目代码
        uses: actions/checkout@v4
        with:
          repository: 'SPlayer-CE/SPlayer-for-Android-Next'
          ref: 'Android'
          fetch-depth: 1

      - name: 配置 pnpm
        uses: pnpm/action-setup@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 配置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: 安装项目依赖
        run: pnpm install --frozen-lockfile

      - name: 配置签名 (可选)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            {
              echo "storeFile=release.keystore"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
            echo "已配置正式签名"
          else
            echo "未配置 Secrets，脚本将自动回退到 Debug 默认签名"
          fi

      - name: 构建 WebView 与嵌入 Node 资源
        run: pnpm build:android

      - name: 编译 Release APK (仅构建 arm64-v8a)
        run: |
          cd android
          chmod +x gradlew
          echo "android.injected.build.abi=arm64-v8a" >> gradle.properties
          ./gradlew assembleRelease -Pandroid.injected.build.abi=arm64-v8a --stacktrace

      - name: 收集 arm64-v8a APK 产物
        run: |
          mkdir -p dist-android
          if [ -f "android/app/build/outputs/apk/release/app-arm64-v8a-release.apk" ]; then
            cp "android/app/build/outputs/apk/release/app-arm64-v8a-release.apk" "dist-android/SPlayer-Next-arm64-v8a.apk"
          elif [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp "android/app/build/outputs/apk/release/app-release.apk" "dist-android/SPlayer-Next-arm64-v8a.apk"
          else
            FOUND_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
            if [ -n "$FOUND_APK" ]; then
              cp "$FOUND_APK" "dist-android/SPlayer-Next-arm64-v8a.apk"
            else
              echo "未找到生成的 APK，请查看上方构建日志"
              exit 1
            fi
          fi
          ls -la dist-android

      - name: 上传 APK 到 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SPlayer-Next-arm64-v8a
          path: dist-android/*.apk
          retention-days: 7
