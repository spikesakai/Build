name: Build CHKayanami/clash-rs (BPI-R4 ARM64)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "上游 CHKayanami/clash-rs 分支 / Tag / Commit"
        required: false
        default: "master"
        type: string
      variant:
        description: "构建版本 (both=精简+标准 / minimal=精简 / standard=完整)"
        required: false
        default: "both"
        type: choice
        options:
          - both
          - minimal
          - standard
      opt_level:
        description: "Cargo 优化等级 (s=体积更小 / 3=性能最强)"
        required: false
        default: "s"
        type: choice
        options:
          - "s"
          - "3"
      publish_release:
        description: "是否发布到当前仓库的 GitHub Releases"
        required: false
        default: true
        type: boolean
  # 如需每天定时自动拉取最新提交构建，取消下面两行注释（UTC 20:00 = 北京时间 04:00）：
  # schedule:
  #   - cron: "0 20 * * *"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM_REPO: "CHKayanami/clash-rs"
  TARGET_ARCH: "aarch64-unknown-linux-musl"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  ZIG_VERSION: "0.17.0"
  CARGO_ZIGBUILD_VERSION: "0.24.0"

jobs:
  # ── 1. 构建内置前端静态资源 (编译阶段嵌入依赖) ────────────────────────────────
  build-dashboard:
    name: Build Dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Upstream
        uses: actions/checkout@v6
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ inputs.ref || 'master' }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "clash-dashboard/package-lock.json"

      - name: Build Dashboard
        working-directory: clash-dashboard
        run: |
          npm ci
          npm run build

      - name: Upload Dashboard
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-dist
          path: clash-dashboard/dist
          retention-days: 1
          if-no-files-found: error

  # ── 2. 构建 eBPF 字节码 (bpfel-unknown-none) ─────────────────────────────────
  build-ebpf:
    name: Build eBPF Bytecode
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Upstream
        uses: actions/checkout@v6
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ inputs.ref || 'master' }}

      - name: Install Nightly Rust (for eBPF)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Install bpf-linker
        uses: taiki-e/install-action@bpf-linker

      - name: Build eBPF Bytecode
        working-directory: clash-ebpf-bpf
        run: cargo +nightly build --release -Zbuild-std=core --target bpfel-unknown-none

      - name: Upload eBPF Bytecode
        uses: actions/upload-artifact@v7
        with:
          name: ebpf-bytecode
          path: target/bpfel-unknown-none/release/clash-ebpf-bpf
          retention-days: 1
          if-no-files-found: error

  # ── 3. 使用 cargo-zigbuild 交叉编译 aarch64-unknown-linux-musl ───────────────
  build:
    name: Build (${{ matrix.variant }}, aarch64-musl)
    needs: [build-dashboard, build-ebpf]
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_RELEASE_OPT_LEVEL: ${{ inputs.opt_level || 's' }}
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON((inputs.variant || 'both') == 'both' && '["minimal","standard"]' || format('["{0}"]', inputs.variant || 'both')) }}

    steps:
      - name: Checkout Upstream
        uses: actions/checkout@v6
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ inputs.ref || 'master' }}

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libclang-dev nasm ninja-build zip

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET_ARCH }}

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@${{ env.CARGO_ZIGBUILD_VERSION }}

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: zigbuild-${{ env.TARGET_ARCH }}-zig-${{ env.ZIG_VERSION }}-cargo-zigbuild-${{ env.CARGO_ZIGBUILD_VERSION }}-opt-${{ inputs.opt_level || 's' }}
          cmd-format: rustup run stable {0}
          cache-bin: false
          save-if: ${{ matrix.variant == 'standard' || (inputs.variant || 'both') == 'minimal' }}

      - name: Download Dashboard
        uses: actions/download-artifact@v8
        with:
          name: dashboard-dist
          path: clash-dashboard/dist

      - name: Download eBPF Bytecode
        uses: actions/download-artifact@v8
        with:
          name: ebpf-bytecode
          path: target/bpfel-unknown-none/release

      - name: Build and Package (${{ matrix.variant }})
        shell: bash
        env:
          TARGET: ${{ env.TARGET_ARCH }}
          VARIANT: ${{ matrix.variant }}
          EXTRA_FEATURES: "jemallocator,ebpf"
          BINARY_NAME: clash-rs
          ARCHIVE_EXT: tar.gz
          USE_ZIGBUILD: "true"
          CLASH_DASHBOARD_PREBUILT: "1"
        run: bash scripts/build_zigbuild.sh

      - name: Upload Archive
        uses: actions/upload-artifact@v7
        with:
          name: clash-rs-${{ matrix.variant }}-${{ env.TARGET_ARCH }}
          path: dist/${{ matrix.variant }}/clash-rs-${{ matrix.variant }}-${{ env.TARGET_ARCH }}.tar.gz
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

  # ── 4. 可选：打包发布到你当前仓库的 GitHub Releases ────────────────────────────
  publish-release:
    name: Publish to GitHub Release
    needs: [build]
    if: ${{ inputs.publish_release != false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Upstream Metadata
        uses: actions/checkout@v6
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ inputs.ref || 'master' }}
          fetch-depth: 10
          path: upstream

      - name: Extract Upstream Commit Info
        id: meta
        working-directory: upstream
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          FULL_SHA=$(git rev-parse HEAD)
          BUILD_DATE=$(date -u +%Y%m%d)
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "date=${BUILD_DATE}" >> "$GITHUB_OUTPUT"
          {
            echo "## Upstream Source"
            echo "- Repository: \`${{ env.UPSTREAM_REPO }}\`"
            echo "- Ref: \`${{ inputs.ref || 'master' }}\`"
            echo "- Commit: \`${FULL_SHA}\`"
            echo "- Target: \`${{ env.TARGET_ARCH }}\` (\`jemallocator,ebpf\`, opt-level=\`${{ inputs.opt_level || 's' }}\`)"
            echo ""
            echo "### Recent Upstream Commits"
            git log -n 10 --format='- %s (%h)'
          } > ../release-notes.md

      - name: Download Build Archives
        uses: actions/download-artifact@v8
        with:
          pattern: clash-rs-*
          path: artifacts

      - name: Organize Release Assets
        run: |
          mkdir -p release_assets
          find artifacts -type f -name "*.tar.gz" -exec cp {} release_assets/ \;
          ls -lh release_assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: clash-rs-${{ steps.meta.outputs.date }}-${{ steps.meta.outputs.short_sha }}
          name: clash-rs (${{ steps.meta.outputs.date }} - ${{ steps.meta.outputs.short_sha }})
          files: release_assets/*
          draft: false
          prerelease: false
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
