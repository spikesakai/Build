name: Build CHKayanami/clash-rs (BPI-R4 ARM64)

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "构建版本 (minimal=精简 / standard=完整 / both=两者都编)"
        required: false
        default: "minimal"
        type: choice
        options:
          - minimal
          - standard
          - both
      opt_level:
        description: "Cargo 优化等级 (s=体积更小 / 3=性能最强)"
        required: false
        default: "3"
        type: choice
        options:
          - "s"
          - "3"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM_REPO: "CHKayanami/clash-rs"
  UPSTREAM_REF: "master"
  TARGET_ARCH: "aarch64-unknown-linux-musl"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  ZIG_VERSION: "0.17.0"
  CARGO_ZIGBUILD_VERSION: "0.24.0"

jobs:
  # ── 1. 构建内置前端静态资源 (编译阶段嵌入依赖) ────────────────────────────────
  build-dashboard:
    name: Build Dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Upstream
        uses: actions/checkout@v6
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "clash-dashboard/package-lock.json"

      - name: Build Dashboard
        working-directory: clash-dashboard
        run: |
          npm ci
          npm run build

      - name: Upload Dashboard
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-dist
          path: clash-dashboard/dist
          retention-days: 1
          if-no-files-found: error

  # ── 2. 构建 eBPF 字节码 (bpfel-unknown-none) ─────────────────────────────────
  build-ebpf:
    name: Build eBPF Bytecode
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Upstream
        uses: actions/checkout@v6
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}

      - name: Install Nightly Rust (for eBPF)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Install bpf-linker
        uses: taiki-e/install-action@bpf-linker

      - name: Build eBPF Bytecode
        working-directory: clash-ebpf-bpf
        run: cargo +nightly build --release -Zbuild-std=core --target bpfel-unknown-none

      - name: Upload eBPF Bytecode
        uses: actions/upload-artifact@v7
        with:
          name: ebpf-bytecode
          path: target/bpfel-unknown-none/release/clash-ebpf-bpf
          retention-days: 1
          if-no-files-found: error

  # ── 3. 使用 cargo-zigbuild 交叉编译 aarch64-unknown-linux-musl ───────────────
  build:
    name: Build (${{ matrix.variant }}, aarch64-musl)
    needs: [build-dashboard, build-ebpf]
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_RELEASE_OPT_LEVEL: ${{ inputs.opt_level || 's' }}
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON((inputs.variant || 'minimal') == 'both' && '["minimal","standard"]' || format('["{0}"]', inputs.variant || 'minimal')) }}

    steps:
      - name: Checkout Upstream
        uses: actions/checkout@v6
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libclang-dev nasm ninja-build zip

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET_ARCH }}

      - name: Cache Zig
        uses: actions/cache@v5
        with:
          path: ~/zig-${{ env.ZIG_VERSION }}
          key: zig-x86_64-linux-${{ env.ZIG_VERSION }}

      - name: Setup Zig
        shell: bash
        run: |
          ZIG_DIR="$HOME/zig-${{ env.ZIG_VERSION }}"
          if [ ! -x "$ZIG_DIR/zig" ]; then
            mkdir -p "$ZIG_DIR"
            curl -fsSL --retry 3 "https://ziglang.org/download/${{ env.ZIG_VERSION }}/zig-x86_64-linux-${{ env.ZIG_VERSION }}.tar.xz" \
              | tar -xJ --strip-components=1 -C "$ZIG_DIR"
          fi
          echo "$ZIG_DIR" >> "$GITHUB_PATH"
          "$ZIG_DIR/zig" version

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@${{ env.CARGO_ZIGBUILD_VERSION }}

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: zigbuild-${{ env.TARGET_ARCH }}-zig-${{ env.ZIG_VERSION }}-cargo-zigbuild-${{ env.CARGO_ZIGBUILD_VERSION }}-opt-${{ inputs.opt_level || 's' }}
          cmd-format: rustup run stable {0}
          cache-bin: false
          save-if: ${{ matrix.variant == 'standard' || (inputs.variant || 'minimal') == 'minimal' }}

      - name: Download Dashboard
        uses: actions/download-artifact@v8
        with:
          name: dashboard-dist
          path: clash-dashboard/dist

      - name: Download eBPF Bytecode
        uses: actions/download-artifact@v8
        with:
          name: ebpf-bytecode
          path: target/bpfel-unknown-none/release

      - name: Append Commit Hash to Version
        shell: bash
        run: |
          python3 - <<'EOF'
          import pathlib, re, subprocess, tomllib

          sha = subprocess.check_output(
              ["git", "rev-parse", "--short=7", "HEAD"], text=True
          ).strip()

          base_ver = None
          for candidate in ("Cargo.toml", "clash-bin/Cargo.toml", "clash_lib/Cargo.toml"):
              p = pathlib.Path(candidate)
              if p.exists():
                  data = tomllib.loads(p.read_text(encoding="utf-8"))
                  base_ver = (
                      data.get("workspace", {}).get("package", {}).get("version")
                      or data.get("package", {}).get("version")
                  )
                  if base_ver:
                      break

          if not base_ver:
              raise SystemExit("Cannot find base version in Cargo.toml")

          new_ver = f"{base_ver}-{sha}" if "-" in base_ver else f"{base_ver}-g{sha}"
          print(f"Version: {base_ver} -> {new_ver}")

          ws_pkg_names = set()
          for path in sorted(pathlib.Path(".").glob("**/Cargo.toml")):
              if any(part in ("target", "clash-dashboard", ".git") for part in path.parts):
                  continue
              data = tomllib.loads(path.read_text(encoding="utf-8"))
              pkg = data.get("package", {})
              pkg_ver = pkg.get("version")
              if pkg.get("name") and (
                  pkg_ver == base_ver or pkg_ver == {"workspace": True}
              ):
                  ws_pkg_names.add(pkg["name"])

              lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
              section = ""
              changed = False
              out = []
              for line in lines:
                  m_sec = re.match(r"^\s*\[([^\]]+)\]", line)
                  if m_sec:
                      section = m_sec.group(1).strip()
                  if section in ("package", "workspace.package"):
                      raw = line.rstrip("\r\n")
                      eol = line[len(raw):]
                      m_ver = re.match(r'^(\s*version\s*=\s*")([^"]+)(".*)$', raw)
                      if m_ver and m_ver.group(2) == base_ver:
                          line = f"{m_ver.group(1)}{new_ver}{m_ver.group(3)}{eol}"
                          changed = True
                  out.append(line)
              if changed:
                  path.write_text("".join(out), encoding="utf-8")
                  print(f"Updated {path}")

          lock_path = pathlib.Path("Cargo.lock")
          if lock_path.exists() and ws_pkg_names:
              lines = lock_path.read_text(encoding="utf-8").splitlines(keepends=True)
              cur_name = None
              has_source = False
              ver_idx = None
              changed = False

              def flush():
                  nonlocal changed
                  if cur_name in ws_pkg_names and not has_source and ver_idx is not None:
                      raw = lines[ver_idx].rstrip("\r\n")
                      eol = lines[ver_idx][len(raw):]
                      m = re.match(r'^(\s*version\s*=\s*")([^"]+)(".*)$', raw)
                      if m and m.group(2) == base_ver:
                          lines[ver_idx] = f"{m.group(1)}{new_ver}{m.group(3)}{eol}"
                          changed = True

              for idx, line in enumerate(lines):
                  if line.strip() == "[[package]]":
                      flush()
                      cur_name = None
                      has_source = False
                      ver_idx = None
                  else:
                      m_name = re.match(r'^\s*name\s*=\s*"([^"]+)"', line)
                      if m_name:
                          cur_name = m_name.group(1)
                      elif re.match(r'^\s*source\s*=', line):
                          has_source = True
                      elif re.match(r'^\s*version\s*=', line):
                          ver_idx = idx
              flush()
              if changed:
                  lock_path.write_text("".join(lines), encoding="utf-8")
                  print("Updated Cargo.lock")
          EOF

      - name: Build and Package (${{ matrix.variant }})
        shell: bash
        env:
          TARGET: ${{ env.TARGET_ARCH }}
          VARIANT: ${{ matrix.variant }}
          EXTRA_FEATURES: "jemallocator,ebpf"
          BINARY_NAME: clash-rs
          ARCHIVE_EXT: tar.gz
          USE_ZIGBUILD: "true"
          CLASH_DASHBOARD_PREBUILT: "1"
        run: bash scripts/build_zigbuild.sh

      - name: Extract Binary (${{ matrix.variant }})
        shell: bash
        run: |
          rm -rf tmp_extract upload_stage
          mkdir -p tmp_extract upload_stage
          tar -xzf "dist/${{ matrix.variant }}/clash-rs-${{ matrix.variant }}-${{ env.TARGET_ARCH }}.tar.gz" -C tmp_extract
          BIN_PATH=$(find tmp_extract -type f -name "clash-rs" | head -n 1)
          if [ -z "$BIN_PATH" ]; then
            BIN_PATH=$(find tmp_extract -type f ! -name "*.sha256" ! -name "*.txt" ! -name "*.md" -executable | head -n 1)
          fi
          if [ -z "$BIN_PATH" ]; then
            echo "Error: clash-rs binary not found in archive!"
            ls -laR tmp_extract
            exit 1
          fi
          mv "$BIN_PATH" upload_stage/clash-rs
          chmod +x upload_stage/clash-rs

      - name: Upload Binary
        uses: actions/upload-artifact@v7
        with:
          name: clash-rs-${{ matrix.variant }}-${{ env.TARGET_ARCH }}
          path: upload_stage/clash-rs
          retention-days: 7
          if-no-files-found: error
