name: Build CHKayanami/clash-rs (BPI-R4 ARM64)

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "构建版本 (minimal=精简 / standard=完整 / both=两者都编)"
        required: false
        default: "minimal"
        type: choice
        options:
          - minimal
          - standard
          - both
      opt_level:
        description: "Cargo 优化等级 (s=体积更小 / 3=性能最强)"
        required: false
        default: "3"
        type: choice
        options:
          - "s"
          - "3"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM_REPO: "CHKayanami/clash-rs"
  UPSTREAM_REF: "master"
  TARGET_ARCH: "aarch64-unknown-linux-musl"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  ZIG_VERSION: "0.17.0"
  CARGO_ZIGBUILD_VERSION: "0.24.0"

jobs:
  # ── 1. 构建内置前端静态资源 (编译阶段嵌入依赖) ────────────────────────────────
  build-dashboard:
    name: Build Dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Upstream
        uses: actions/checkout@v6
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "clash-dashboard/package-lock.json"

      - name: Build Dashboard
        working-directory: clash-dashboard
        run: |
          npm ci
          npm run build

      - name: Upload Dashboard
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-dist
          path: clash-dashboard/dist
          retention-days: 1
          if-no-files-found: error

  # ── 2. 构建 eBPF 字节码 (bpfel-unknown-none) ─────────────────────────────────
  build-ebpf:
    name: Build eBPF Bytecode
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Upstream
        uses: actions/checkout@v6
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}

      - name: Install Nightly Rust (for eBPF)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Install bpf-linker
        uses: taiki-e/install-action@bpf-linker

      - name: Build eBPF Bytecode
        working-directory: clash-ebpf-bpf
        run: cargo +nightly build --release -Zbuild-std=core --target bpfel-unknown-none

      - name: Upload eBPF Bytecode
        uses: actions/upload-artifact@v7
        with:
          name: ebpf-bytecode
          path: target/bpfel-unknown-none/release/clash-ebpf-bpf
          retention-days: 1
          if-no-files-found: error

  # ── 3. 使用 cargo-zigbuild 交叉编译 aarch64-unknown-linux-musl ───────────────
  build:
    name: Build (${{ matrix.variant }}, aarch64-musl)
    needs: [build-dashboard, build-ebpf]
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_RELEASE_OPT_LEVEL: ${{ inputs.opt_level || 's' }}
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON((inputs.variant || 'minimal') == 'both' && '["minimal","standard"]' || format('["{0}"]', inputs.variant || 'minimal')) }}

    steps:
      - name: Checkout Upstream
        uses: actions/checkout@v6
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libclang-dev nasm ninja-build zip

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET_ARCH }}

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@${{ env.CARGO_ZIGBUILD_VERSION }}

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: zigbuild-${{ env.TARGET_ARCH }}-zig-${{ env.ZIG_VERSION }}-cargo-zigbuild-${{ env.CARGO_ZIGBUILD_VERSION }}-opt-${{ inputs.opt_level || 's' }}
          cmd-format: rustup run stable {0}
          cache-bin: false
          save-if: ${{ matrix.variant == 'standard' || (inputs.variant || 'minimal') == 'minimal' }}

      - name: Download Dashboard
        uses: actions/download-artifact@v8
        with:
          name: dashboard-dist
          path: clash-dashboard/dist

      - name: Download eBPF Bytecode
        uses: actions/download-artifact@v8
        with:
          name: ebpf-bytecode
          path: target/bpfel-unknown-none/release

      - name: Build and Package (${{ matrix.variant }})
        shell: bash
        env:
          TARGET: ${{ env.TARGET_ARCH }}
          VARIANT: ${{ matrix.variant }}
          EXTRA_FEATURES: "jemallocator,ebpf"
          BINARY_NAME: clash-rs
          ARCHIVE_EXT: tar.gz
          USE_ZIGBUILD: "true"
          CLASH_DASHBOARD_PREBUILT: "1"
        run: bash scripts/build_zigbuild.sh

      - name: Extract Binary (${{ matrix.variant }})
        shell: bash
        run: |
          rm -rf tmp_extract upload_stage
          mkdir -p tmp_extract upload_stage
          tar -xzf "dist/${{ matrix.variant }}/clash-rs-${{ matrix.variant }}-${{ env.TARGET_ARCH }}.tar.gz" -C tmp_extract
          BIN_PATH=$(find tmp_extract -type f -name "clash-rs" | head -n 1)
          if [ -z "$BIN_PATH" ]; then
            BIN_PATH=$(find tmp_extract -type f ! -name "*.sha256" ! -name "*.txt" ! -name "*.md" -executable | head -n 1)
          fi
          if [ -z "$BIN_PATH" ]; then
            echo "Error: clash-rs binary not found in archive!"
            ls -laR tmp_extract
            exit 1
          fi
          mv "$BIN_PATH" upload_stage/clash-rs
          chmod +x upload_stage/clash-rs

      - name: Upload Binary
        uses: actions/upload-artifact@v7
        with:
          name: clash-rs-${{ matrix.variant }}-${{ env.TARGET_ARCH }}
          path: upload_stage/clash-rs
          retention-days: 7
          if-no-files-found: error
