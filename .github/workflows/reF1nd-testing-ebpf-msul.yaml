name: Build reF1nd-testing-next sing-box ebpf core

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Source ref to build (tag/branch/commit)'
        type: string
        required: true
        default: 'reF1nd-testing-next'
      custom_version:
        description: 'Manual Version (e.g. 1.14.0-beta.17)'
        type: string
        required: true
        default: '1.14.0-beta.17'
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    permissions:
      contents: write
    steps:
      - name: Prepare context
        id: prep
        run: |
          UPSTREAM_REPO="https://github.com/reF1nd/sing-box.git"
          REF="${{ github.event.inputs.source_ref }}"
          VERSION="${{ github.event.inputs.custom_version }}"

          echo "REF=$REF" >> $GITHUB_ENV
          echo "UPSTREAM_REPO=$UPSTREAM_REPO" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV

          echo "ref=$REF" >> $GITHUB_OUTPUT
          echo "upstream=$UPSTREAM_REPO" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Resolve SHA (tag/branch/commit)
        id: upstream
        run: |
          set -e
          SHA=$(git ls-remote --heads "${UPSTREAM_REPO}" "refs/heads/${REF}" | cut -f1)
          if [ -z "$SHA" ]; then
            SHA=$(git ls-remote --tags "${UPSTREAM_REPO}" "refs/tags/${REF}" | cut -f1)
          fi
          if [ -z "$SHA" ]; then
            SHA=$(git ls-remote --tags "${UPSTREAM_REPO}" "refs/tags/${REF}^{}" | cut -f1)
          fi
          if [ -z "$SHA" ]; then
            SHA=$(git ls-remote "${UPSTREAM_REPO}" "${REF}" | cut -f1)
          fi
          if [ -z "$SHA" ]; then
            echo "ERROR: REF '${REF}' not found (branch/tag/commit)."
            exit 1
          fi
          SHORT="${SHA:0:7}"
          echo "UPSTREAM_SHA=$SHA" >> $GITHUB_ENV
          echo "SHORT_SHA=$SHORT" >> $GITHUB_ENV
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "short=$SHORT" >> $GITHUB_OUTPUT

      - name: Checkout upstream with full history
        uses: actions/checkout@v6
        with:
          repository: reF1nd/sing-box
          ref: ${{ steps.upstream.outputs.sha }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'

      - name: Install NDK r29 (Clang 21) for eBPF
        run: |
          set -xeuo pipefail
          # 下载 NDK r29 Canary (这是 reF1nd 指定的版本)
          # 注意：URL 随 Google 更新可能变动，如果失效请检查 reF1nd 的 CI 脚本
          wget -q https://dl.google.com/android/repository/android-ndk-r29-canary-linux.zip -O ndk.zip
          unzip -q ndk.zip
          NDK_DIR=$(ls -d android-ndk-r*)
          
          # 定位 Clang 21 的二进制路径
          CLANG_BIN_DIR="$GITHUB_WORKSPACE/$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin"
          
          # 将其加入系统路径并设置环境变量供 Makefile 调用
          echo "$CLANG_BIN_DIR" >> $GITHUB_PATH
          echo "CLANG=$CLANG_BIN_DIR/clang" >> $GITHUB_ENV
          echo "STRIP=$CLANG_BIN_DIR/llvm-strip" >> $GITHUB_ENV

      - name: Generate eBPF Object
        run: |
          set -xeuo pipefail
          # 确保环境变量生效，执行 make
          # 显式传递变量以确保 Makefile 检查通过
          make -C common/ebpf CLANG=$CLANG STRIP=$STRIP

      - name: Define build metadata
        id: meta
        run: |
          set -xeuo pipefail
          TAGS="with_gvisor with_quic with_grpc with_utls with_clash_api with_ebpf badlinkname"
          OUT="sing-box-${VERSION}-linux-arm64"

          echo "TAGS=$TAGS" >> $GITHUB_ENV
          echo "OUT=$OUT" >> $GITHUB_ENV

          echo "tags=$TAGS" >> $GITHUB_OUTPUT
          echo "out=$OUT" >> $GITHUB_OUTPUT

      - name: Build sing-box (linux arm64)
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: arm64
        run: |
          set -xeuo pipefail
          go build \
            -trimpath \
            -o "${OUT}" \
            -ldflags="-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' -s -w -buildid= -checklinkname=0" \
            -tags="${TAGS}" \
            ./cmd/sing-box

      - name: Verify arch and static linking
        run: file "${OUT}"

      - name: Prepare executable file
        run: |
          chmod +x "${OUT}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sing-box-next-linux-arm64-${{ steps.upstream.outputs.short }}
          path: |
            ${{ steps.meta.outputs.out }}
