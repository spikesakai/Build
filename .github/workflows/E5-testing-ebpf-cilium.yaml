name: Build e5-cilium sing-box eBPF core

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Source ref to build (tag/branch/commit)'
        type: string
        required: true
        default: 'testing-ebpf-cilium'
      custom_version:
        description: 'Manual Version'
        type: string
        required: true
        default: '1.14.0-beta.17'

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: CHIZI-0618/sing-box
          ref: ${{ github.event.inputs.source_ref }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod # 自动从源码获取 Go 版本
          cache: true

      - name: Verify checked-in eBPF objects
        run: |
          set -euo pipefail
          echo "Checking for pre-compiled eBPF objects..."
          test -f common/ebpf/internal/bpfgen/cgroup_bpfel.o
          test -f common/ebpf/internal/bpfgen/shared_network_bpfel.o
          test -f common/ebpf/internal/bpfgen/splice_bpfel.o
          ls -lh common/ebpf/internal/bpfgen/*.o

      - name: Run focused eBPF tests
        shell: bash
        run: |
          set -euo pipefail
          go test -v -count=1 \
            -tags "with_ebpf" \
            ./common/ebpf ./protocol/ebpf ./include ./option

  build:
    needs: verifier
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: CHIZI-0618/sing-box
          ref: ${{ github.event.inputs.source_ref }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.7'

      - name: Build for Linux ARM64
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 0
          TAGS: with_ebpf,with_quic,with_utls,with_clash_api,badlinkname,tfogo_checklinkname0
        run: |
          set -euo pipefail

          if [ -f release/LDFLAGS ]; then
            SHARED_LDFLAGS=$(tr -d '\n' < release/LDFLAGS)
          else
            SHARED_LDFLAGS=""
          fi

          go build -v -trimpath \
            -tags "$TAGS" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${{ github.event.inputs.custom_version }}' $SHARED_LDFLAGS -s -w -buildid=" \
            -o sing-box-linux-arm64 \
            ./cmd/sing-box

      - name: Verify binary architecture
        run: |
          file sing-box-linux-arm64
          if ! file sing-box-linux-arm64 | grep -q "aarch64"; then echo "Error: Not ARM64"; exit 1; fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-linux-arm64-ebpf
          path: sing-box-linux-arm64
