name: Android Build

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '选择构建分支'
        required: true
        default: 'Android'
        type: string

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # 严格保留原作者的完整 git 历史检出
      - uses: actions/checkout@v4
        with:
          repository: 'SPlayer-CE/SPlayer-for-Android-Next'
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 原版签名配置与回退逻辑，原封不动
      - name: 配置签名
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            {
              echo "storeFile=release.keystore"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
            echo "已从 secrets 恢复正式签名密钥"
          else
            echo "未配置签名 secrets，回退 debug 签名（app/build.gradle 自带回退逻辑）"
          fi

      # 严格使用原版的整体构建脚本，不再人工拆解
      - name: 构建 WebView 与嵌入 Node 资源
        run: pnpm build:android

      # 严格使用原版 Release 编译命令
      - name: 构建 Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      # 仅提取你要的 arm64-v8a 架构包
      - name: 收集 arm64-v8a APK
        run: |
          mkdir -p dist-android
          src="android/app/build/outputs/apk/release/app-arm64-v8a-release.apk"
          if [ -f "$src" ]; then
            cp "$src" "dist-android/SPlayer-Next-${{ inputs.branch }}-arm64-v8a.apk"
          elif [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp "android/app/build/outputs/apk/release/app-release.apk" "dist-android/SPlayer-Next-${{ inputs.branch }}-arm64-v8a.apk"
          fi
          ls -la dist-android

      # 严格走 Artifacts 上传 zip 产物，不发任何 Release
      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: SPlayer-Next-arm64-v8a
          path: dist-android/*.apk
          retention-days: 7
