name: Build Android APK Only

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '请输入要构建的上游分支名 (例如: Android 或 feat/android-next-blue-icons)'
        required: true
        default: 'Android'
        type: string

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 检出上游项目代码
        uses: actions/checkout@v5
        with:
          repository: 'SPlayer-CE/SPlayer-for-Android-Next'
          ref: ${{ inputs.branch }}
          fetch-depth: 1

      - name: 配置 pnpm
        uses: pnpm/action-setup@v5

      - name: 配置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: 配置 Java 环境
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: 安装项目依赖
        run: pnpm install --frozen-lockfile

      - name: 配置签名 (可选)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            {
              echo "storeFile=release.keystore"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
            echo "已配置正式签名"
          else
            echo "未配置 Secrets，脚本将自动回退到 Debug 默认签名"
          fi

      - name: 构建 WebView 与嵌入 Node 资源
        run: pnpm build:android

      - name: 编译 Release APK (标准流程)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: 收集 arm64-v8a APK 产物
        run: |
          mkdir -p dist-android
          src="android/app/build/outputs/apk/release/app-arm64-v8a-release.apk"
          if [ -f "$src" ]; then
            cp "$src" "dist-android/SPlayer-Next-arm64-v8a.apk"
            echo "成功提取 arm64-v8a 架构包！"
          elif [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp "android/app/build/outputs/apk/release/app-release.apk" "dist-android/SPlayer-Next-arm64-v8a.apk"
            echo "成功提取 Release 通用包！"
          else
            echo "❌ 未找到 arm64-v8a 安装包，输出目录内容如下："
            ls -la android/app/build/outputs/apk/release/ || true
            exit 1
          fi
          ls -la dist-android

      - name: 上传 APK 到 Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: SPlayer-Next-arm64-v8a
          path: dist-android/*.apk
          retention-days: 7
