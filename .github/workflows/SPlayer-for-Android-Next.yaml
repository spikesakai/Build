name: Build SPlayer (arm64-v8a)

# 仅手动触发
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 直接拉取原作者 Android 分支源码（附带拉取 C++ 依赖子模块，防止 CMake 报错）
      - name: 拉取源码
        uses: actions/checkout@v4
        with:
          repository: SPlayer-CE/SPlayer-for-Android-Next
          ref: Android
          submodules: recursive

      # 2. 准备 Node 与 pnpm（自动匹配项目 11.10.0 版本）
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 设置 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # 3. 准备 Java 环境
      - name: 设置 Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # 4. 安装依赖并构建原生资源
      - name: 安装依赖与构建资源
        run: |
          pnpm install
          pnpm build:android

      # 5. 【核心修复】：注入明文 HTTP 权限（彻底解决装不上插件的问题）
      - name: 修复插件网络通信权限
        run: |
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

      # 6. 编译 Release APK
      - name: 构建 APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleRelease --stacktrace

      # 7. 仅提取 arm64-v8a 架构包
      - name: 提取 arm64-v8a APK
        run: |
          mkdir -p output
          find android/app/build/outputs/apk/ -type f -name "*arm64-v8a*.apk" -exec cp {} output/ \;
          ls -la output

      # 8. 上传到 Actions 下载区
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: SPlayer-Next-arm64-v8a
          path: output/*.apk
