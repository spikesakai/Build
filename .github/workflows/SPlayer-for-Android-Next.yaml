name: Build Android APK Only

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '选择构建分支 (例如: Android 或 feat/android-next-blue-icons)'
        required: true
        default: 'Android'
        type: string
      build_type:
        description: '构建类型 (未配置签名 secrets 请务必选 debug，保证能正常打开)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出上游项目代码
        uses: actions/checkout@v5
        with:
          repository: 'SPlayer-CE/SPlayer-for-Android-Next'
          ref: ${{ inputs.branch }}
          fetch-depth: 1

      - name: 配置 pnpm
        uses: pnpm/action-setup@v5

      - name: 配置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: 配置 Java 环境
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: 准备 .env 环境变量文件
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
            echo "已从 .env.example 生成 .env"
          fi

      - name: 安装项目依赖
        run: pnpm install --frozen-lockfile

      - name: 构建 Web 前端资源
        run: pnpm build:web

      - name: 同步 Capacitor 原生工程
        run: npx cap sync android

      - name: 构建内置 Node API Bundle
        run: pnpm build:android:node

      - name: 注入内置 Android 嵌入式资源 (解决卡启动界面的核心)
        run: pnpm prepare:android:embedded

      - name: 配置 Release 签名 (仅当选择 release 且配置了 Secrets 时生效)
        if: ${{ inputs.build_type == 'release' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            {
              echo "storeFile=release.keystore"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
            echo "已配置正式签名"
          else
            echo "⚠️ 未检测到签名 Secrets，建议使用 debug 类型构建"
          fi

      - name: 编译 APK
        run: |
          cd android
          chmod +x gradlew
          if [ "${{ inputs.build_type }}" = "release" ]; then
            ./gradlew assembleRelease --stacktrace
          else
            ./gradlew assembleDebug --stacktrace
          fi

      - name: 收集 arm64-v8a APK 产物
        run: |
          mkdir -p dist-android
          BUILD_TYPE="${{ inputs.build_type }}"
          APK_DIR="android/app/build/outputs/apk/${BUILD_TYPE}"

          if [ -f "${APK_DIR}/app-arm64-v8a-${BUILD_TYPE}.apk" ]; then
            cp "${APK_DIR}/app-arm64-v8a-${BUILD_TYPE}.apk" "dist-android/SPlayer-Next-${BUILD_TYPE}-arm64-v8a.apk"
          elif [ -f "${APK_DIR}/app-${BUILD_TYPE}.apk" ]; then
            cp "${APK_DIR}/app-${BUILD_TYPE}.apk" "dist-android/SPlayer-Next-${BUILD_TYPE}-arm64-v8a.apk"
          else
            FOUND=$(find "${APK_DIR}" -name "*.apk" | grep -E "arm64|universal" | head -n 1)
            [ -z "$FOUND" ] && FOUND=$(find "${APK_DIR}" -name "*.apk" | head -n 1)
            if [ -n "$FOUND" ]; then
              cp "$FOUND" "dist-android/SPlayer-Next-${BUILD_TYPE}-arm64-v8a.apk"
            else
              echo "❌ 未找到生成的 APK，当前 ${APK_DIR} 目录内容："
              ls -la "${APK_DIR}" || true
              exit 1
            fi
          fi
          ls -la dist-android

      - name: 更新固定 Release (直接下载 APK)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "SPlayer-Next 最新可用构建"
          body: |
            - 构建分支：`${{ inputs.branch }}`
            - 构建类型：`${{ inputs.build_type }}`
            - 目标架构：**arm64-v8a**
            - 已完整注入内置 Node.js 运行时与前端资源。
          files: dist-android/*.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
