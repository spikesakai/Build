name: Android Build

on:
  # 支持在 GitHub 网页端随时点击 "Run workflow" 手动打包
  workflow_dispatch:

  # 推送代码到 Android、main 或 master 分支时自动打包
  push:
    branches: [Android, main, master]

  pull_request:
    branches: [Android, main, master]

defaults:
  run:
    shell: bash

jobs:
  # PR 时做静态检查
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 构建 Web 并同步 Capacitor
        run: pnpm build:web && pnpm cap:sync
      - name: 校验内嵌 Node 服务打包
        run: pnpm build:android:node
      - name: 静态校验
        run: cd android && ./gradlew ktlintCheck compileKotlin detekt

  # 构建 Release APK 并上传到 Actions Artifacts
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 配置签名
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            {
              echo "storeFile=release.keystore"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
            echo "已从 secrets 恢复正式签名密钥"
          else
            echo "未配置签名 secrets，回退 debug 签名（app/build.gradle 自带回退逻辑）"
          fi

      # 【核心修复】：显式打包内嵌 Node 服务并同步 Capacitor 原生插件
      - name: 构建 Web、编译内嵌 Node 服务并同步 Capacitor
        run: |
          pnpm build:web
          pnpm build:android:node
          pnpm cap:sync

      # 【核心修复】：注入明文 HTTP 权限，防止拦截本地 Node 服务的插件通信
      - name: 配置 Android 网络安全权限 (允许明文 HTTP)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if grep -q "android:usesCleartextTraffic" "$MANIFEST"; then
            echo "已存在 usesCleartextTraffic 配置，跳过修改"
          else
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST"
            echo "已成功注入 android:usesCleartextTraffic=\"true\""
          fi

      - name: 构建 Release APK
        run: cd android && ./gradlew assembleRelease --stacktrace

      - name: 收集各架构 APK
        run: |
          mkdir -p dist-android
          TAG_OR_BRANCH="${GITHUB_REF_NAME:-manual}"
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            src="android/app/build/outputs/apk/release/app-${abi}-release.apk"
            if [ -f "$src" ]; then
              cp "$src" "dist-android/SPlayer-Next-${TAG_OR_BRANCH}-${abi}.apk"
            fi
          done
          ls -la dist-android

      # 仅在 Actions 产物中上传保存，保留 30 天
      - name: 上传 APK 到 Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SPlayer-Next-APKs-build-${{ github.run_number }}
          path: dist-android/*.apk
          retention-days: 30
