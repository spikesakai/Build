name: Build SPlayer (arm64-v8a)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: 拉取原项目源码
        uses: actions/checkout@v4
        with:
          repository: SPlayer-CE/SPlayer-for-Android-Next
          ref: Android
          submodules: recursive

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 设置 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 设置 Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建 WebView 与嵌入 Node 资源
        run: pnpm build:android

      - name: 构建 Release APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleRelease --stacktrace

      - name: 收集 arm64-v8a APK
        run: |
          mkdir -p output
          find android/app/build/outputs/apk/ -type f -name "*arm64-v8a*.apk" -exec cp {} output/ \;
          ls -la output

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: SPlayer-Next-arm64-v8a
          path: output/*.apk
