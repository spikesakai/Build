name: Remote SPlayer Android Build

# 仅由你在网页端点击 "Run workflow" 手动触发打包
on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # 【核心改动】：直接拉取原作者项目的 Android 分支源码
      - name: 拉取原项目源码
        uses: actions/checkout@v4
        with:
          repository: SPlayer-CE/SPlayer-for-Android-Next
          ref: Android

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 设置 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 设置 Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: 安装项目依赖
        run: pnpm install

      - name: 配置签名回退机制
        run: |
          echo "在个人仓库构建，自动回退使用 Debug 签名打包"

      # 【核心修复】：完整打包 Web、Node 内嵌核心与 Capacitor 原生插件
      - name: 构建 Web、编译 Node 核心服务并同步 Capacitor
        run: |
          pnpm build:web
          pnpm build:android:node
          pnpm cap:sync

      # 【核心修复】：注入明文 HTTP 权限，防止手机拦截本地 Node 服务的插件网络通信
      - name: 配置 Android 网络安全权限 (允许明文 HTTP)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if grep -q "android:usesCleartextTraffic" "$MANIFEST"; then
            echo "已存在 usesCleartextTraffic 配置，跳过修改"
          else
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST"
            echo "已成功注入 android:usesCleartextTraffic=\"true\""
          fi

      # 编译 Android Release APK
      - name: 构建 APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleRelease --stacktrace

      # 收集打包出来的所有 APK 文件（做保底兼容收集）
      - name: 收集生成的 APK
        run: |
          mkdir -p dist-android
          # 自动寻找所有生成的 apk 并复制出来
          find android/app/build/outputs/apk/ -type f -name "*.apk" -exec cp {} dist-android/ \;
          ls -la dist-android

      # 上传到 Actions Artifacts 供下载
      - name: 上传 APK 到 Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SPlayer-Next-APKs-${{ github.run_number }}
          path: dist-android/*.apk
          retention-days: 30
